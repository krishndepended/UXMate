<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>UXMate — Project Coach</title>
  <meta name="description" content="A comprehensive UX project management tool.">
  <meta name="theme-color" content="#3b82f6">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">

  <!-- Styles & Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            'glow': '0 0 15px rgba(59, 130, 246, 0.5)',
            'fab': '0 8px 30px rgba(37, 99, 235, 0.3)',
            'sheet': '0 -10px 40px -10px rgba(0, 0, 0, 0.1)',
          },
          borderRadius: {
            'xl': '1rem',
            '2xl': '1.5rem',
            '3xl': '2rem',
          }
        },
      },
    }
  </script>
  <style>
    body { 
      background-color: #f8fafc; 
      color: #0f172a;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none; /* Prevent pull-to-refresh if possible */
    }

    /* Mobile Typography Scaling */
    @media (max-width: 768px) {
      h1 { font-size: 1.25rem !important; }
      h2 { font-size: 1.125rem !important; }
      .text-base { font-size: 1rem !important; }
      .text-sm { font-size: 0.875rem !important; }
    }
    
    /* Scrollbar Styling */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
    
    /* Animations */
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .animate-slide-up {
      animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
    
    .pt-safe {
      padding-top: env(safe-area-inset-top, 0px);
    }

    .active-scale:active {
      transform: scale(0.96);
    }

    .glass-nav {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Hide scrollbar for clean horizontal lists */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900 overflow-x-hidden">
  <div id="root"></div>
  <script type="text/babel" data-type="module" src="index.tsx"></script>
</body>
</html>
