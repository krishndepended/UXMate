<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>UXMate — Design Process Coach</title>
  <meta name="description" content="A professional UX project management tool for designers.">
  <meta name="theme-color" content="#f8fafc">
  
  <link rel="manifest" href="./assets/manifest-CrV3b4Ow.json">
  <link rel="icon" type="image/svg+xml" href="./assets/icon-Di5g0Sny.svg" />
  <link rel="apple-touch-icon" href="./assets/icon-Di5g0Sny.svg" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'soft': '0 2px 15px -3px rgba(0, 0, 0, 0.07), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
            'glow': '0 0 25px rgba(59, 130, 246, 0.2)',
            'fab': '0 12px 45px -5px rgba(15, 23, 42, 0.3)',
            'sheet': '0 -15px 50px -12px rgba(0, 0, 0, 0.15)',
          },
          letterSpacing: {
            'widest': '0.25em',
            'tightest': '-0.05em',
          },
          spacing: {
            '18': '4.5rem',
          }
        },
      },
    }
  </script>
  <style>
    :root {
      --sat: env(safe-area-inset-top);
      --sab: env(safe-area-inset-bottom);
      --sar: env(safe-area-inset-right);
      --sal: env(safe-area-inset-left);
    }
    
    body { 
      background-color: #f8fafc; 
      color: #0f172a;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      height: 100vh;
      width: 100vw;
      position: fixed;
      overflow: hidden;
    }

    #root {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Safe Area Utilities */
    .pt-safe { padding-top: var(--sat); }
    .pb-safe { padding-bottom: var(--sab); }
    .pl-safe { padding-left: var(--sal); }
    .pr-safe { padding-right: var(--sar); }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
    
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Animation Utilities */
    .transition-premium { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .active-scale:active { transform: scale(0.97); }

    /* Typography Scale */
    .heading-huge { font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 900; line-height: 1.1; letter-spacing: -0.05em; }
    .heading-section { font-size: clamp(1.5rem, 5vw, 2.25rem); font-weight: 900; line-height: 1.2; letter-spacing: -0.04em; }
    .label-caps { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.2em; color: #64748b; }
    .body-large { font-size: 1.125rem; line-height: 1.8; color: #334155; }

    /* Layout Hierarchy */
    .container-spacing { padding: clamp(1rem, 4vw, 2.5rem); }
    .card-radius { border-radius: clamp(1.5rem, 5vw, 2.5rem); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script type="module" crossorigin src="./assets/index-D728VT9y.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>
</body>
</html>
