  <!-- Firebase Global Init (Module based) - GATED FOR LOCAL MODE -->
  <script type="module">
    /*
      GLOBAL FIREBASE INITIALIZER
      - Gated: Only initializes if valid config is provided.
      - Exposes window.FB and window.uploadFileToFirebase(file).
    */
    
    // ====== [OPTIONAL] PASTE YOUR FIREBASE CONFIG BELOW TO ENABLE CLOUD SYNC ======
    // If you leave these as "REPLACE_...", the app runs in Offline/Local Mode.
    const FIREBASE_CONFIG_PLACEHOLDER = {
      apiKey: "REPLACE_API_KEY",
      authDomain: "REPLACE_PROJECT.firebaseapp.com",
      projectId: "REPLACE_PROJECT_ID",
      storageBucket: "REPLACE_PROJECT.appspot.com",
      messagingSenderId: "REPLACE_SENDER_ID",
      appId: "REPLACE_APP_ID"
    };
    // ==============================================================================

    window.initFirebaseIfNeeded = async function(config) {
      // 1. Check for placeholders or missing config -> Enforce Local Mode
      if(!config || !config.apiKey || config.apiKey.startsWith("REPLACE_")) {
        console.log('UXMate: Running in Local Mode (Cloud Sync Disabled). To enable, update FIREBASE_CONFIG_PLACEHOLDER in index.html');
        return null;
      }

      if(window.FB && window.FB._initialized) return window.FB;

      try {
        console.log('UXMate: Attempting Firebase Connection...');
        const [{ initializeApp, getApps }, 
               { getAuth, signInAnonymously, onAuthStateChanged }, 
               { getFirestore, doc, setDoc, getDoc, onSnapshot },
               { getStorage, ref, uploadBytes, getDownloadURL }] = await Promise.all([
          import('https://www.gstatic.com/firebasejs/10.6.0/firebase-app.js').then(m=>[m.initializeApp, m.getApps]),
          import('https://www.gstatic.com/firebasejs/10.6.0/firebase-auth.js'),
          import('https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore.js'),
          import('https://www.gstatic.com/firebasejs/10.6.0/firebase-storage.js')
        ]);

        const app = (getApps && getApps().length) ? getApps()[0] : initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // Anonymous Auth
        signInAnonymously(auth).catch(e => console.warn('Firebase Auth failed (Offline Mode):', e));

        window.FB = {
          _initialized: true,
          app, auth, db, storage,
          doc, setDoc, getDoc, onSnapshot,
          ref, uploadBytes, getDownloadURL,
          onAuthStateChanged
        };

        // File Upload Helper (Cloud)
        window.uploadFileToFirebase = async function(file) {
          if(!window.FB || !window.FB.storage) throw new Error('Firebase not ready');
          const user = window.FB.auth.currentUser || { uid: 'anonymous' };
          const path = `users/${user.uid}/assets/${Date.now()}_${file.name.replace(/\s+/g,'_')}`;
          const storageRef = window.FB.ref(window.FB.storage, path);
          await window.FB.uploadBytes(storageRef, file);
          return await window.FB.getDownloadURL(storageRef);
        };

        // Sync Logic
        window.FB.onAuthStateChanged(auth, async (user) => {
          if(user) {
             console.debug('UXMate: Cloud Sync Active for:', user.uid);
          }
        });

        console.log('UXMate: Firebase Initialized Successfully');
        return window.FB;
      } catch(e) {
        console.warn('UXMate: Firebase init failed. Falling back to Local Mode.', e);
        return null;
      }
    };

    // Attempt Init
    window.initFirebaseIfNeeded(FIREBASE_CONFIG_PLACEHOLDER);
  </script>
