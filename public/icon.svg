<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="uxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e3a8a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  <rect x="56" y="56" width="400" height="400" rx="96" fill="url(#uxGrad)" filter="url(#shadow)" />
  <!-- UX Diamond Icon Graphic -->
  <g transform="translate(256, 256)">
    <!-- Left diamond (Discover / Define) -->
    <path d="M -90 0 L -45 -60 L 0 0 L -45 60 Z" fill="#ffffff" fill-opacity="0.95" />
    <!-- Right diamond (Develop / Deliver) -->
    <path d="M 0 0 L 45 -60 L 90 0 L 45 60 Z" fill="#93c5fd" fill-opacity="0.95" />
    <!-- Center connecting spark -->
    <circle cx="0" cy="0" r="14" fill="#ffffff" />
    <circle cx="-45" cy="0" r="8" fill="#1d4ed8" />
    <circle cx="45" cy="0" r="8" fill="#1d4ed8" />
  </g>
  <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">UXMATE</text>
</svg>
